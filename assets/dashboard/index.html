<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoongSuite Pilot Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: rgba(17, 24, 43, 0.9);
      --panel-soft: rgba(21, 31, 54, 0.86);
      --line: rgba(148, 163, 184, 0.16);
      --text: #edf2ff;
      --muted: #94a3b8;
      --accent: #69e6a6;
      --blue: #7dd3fc;
      --warn: #fbbf24;
    }

    * { box-sizing: border-box; }
    .code-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .code-heading h2 { margin-bottom: 0; }
    .code-heading { flex-wrap: wrap; }
    .code-dates { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .code-dates label { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .code-dates input { color: var(--text); background: var(--panel-soft); border: 1px solid var(--line); border-radius: 8px; padding: 7px; font: inherit; }
    .code-table-wrap { overflow-x: auto; margin-top: 16px; }
    .code-table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
    .code-table th, .code-table td { padding: 13px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
    .code-table th { color: var(--muted); font-size: 12px; font-weight: 500; }
    .code-table th:first-child, .code-table td:first-child { text-align: left; }
    .code-table .code-added { color: var(--accent); }
    .code-table .code-deleted { color: #fda4af; }
    .code-table .code-unknown { color: var(--warn); }
    .code-note { color: var(--muted); font-size: 12px; line-height: 1.7; margin: 12px 0 0; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1a2a4a 0, var(--bg) 42%);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1180px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0 40px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.03em; }
    h2 { margin: 0 0 14px; font-size: 17px; }
    p { margin: 0; color: var(--muted); }
    .toolbar, .status { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; }
    .toolbar { flex-wrap: wrap; justify-content: flex-end; }
    .language-icon { width: 14px; height: 14px; flex: 0 0 14px; color: inherit; }
    select {
      background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line); border-radius: 999px;
      color: var(--text); padding: 5px 10px; font-size: 12px;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 16px var(--warn); }
    .dot.ok { background: var(--accent); box-shadow: 0 0 16px var(--accent); }
    .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .two-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .agent-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .section { margin-top: 18px; }
    .card, .panel, .agent-card {
      padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.22);
    }
    .label { margin-bottom: 7px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    .value { font-size: 25px; font-weight: 720; letter-spacing: -0.03em; }
    .subvalue { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .agent-title { margin-bottom: 12px; font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
    .kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .kv > div { padding: 10px; border-radius: 12px; background: var(--panel-soft); }
    .kv .value { font-size: 20px; }
    .list { display: grid; gap: 9px; }
    .list-row { display: grid; grid-template-columns: minmax(100px, 1fr) auto auto; gap: 14px; align-items: center; }
    .list-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar { height: 6px; margin-top: 5px; border-radius: 999px; background: rgba(148, 163, 184, 0.13); overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--blue)); }
    .trend-wrap { position: relative; }
    .trend { display: grid; grid-template-columns: repeat(30, minmax(3px, 1fr)); align-items: stretch; height: 160px; gap: 3px; }
    .trend-bar {
      display: flex; align-items: flex-end; min-width: 0; height: 100%; padding: 0; border: 0;
      background: transparent; cursor: crosshair;
    }
    .trend-bar-fill {
      display: block; width: 100%; min-height: 2px; border-radius: 4px 4px 0 0;
      background: linear-gradient(var(--blue), rgba(125, 211, 252, 0.35)); pointer-events: none;
    }
    .trend-bar:hover .trend-bar-fill, .trend-bar:focus-visible .trend-bar-fill { filter: brightness(1.25); }
    .trend-bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
    .trend-tooltip {
      position: absolute; z-index: 2; left: 4px; top: 4px; width: max-content; max-width: calc(100% - 8px); padding: 7px 9px;
      border: 1px solid rgba(125, 211, 252, .35); border-radius: 9px; background: #111a2d;
      color: var(--text); box-shadow: 0 8px 28px rgba(0, 0, 0, .35); font-size: 12px;
      line-height: 1.45; pointer-events: none; opacity: 0; transition: opacity .12s ease;
    }
    .trend-tooltip.show { opacity: 1; }
    .trend-tooltip strong { display: block; color: var(--blue); font-size: 13px; }
    .trend-labels { display: flex; justify-content: space-between; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .notice { display: none; padding: 12px 14px; border: 1px solid rgba(251,191,36,.35); border-radius: 14px; background: rgba(251,191,36,.1); color: #fde68a; font-size: 13px; }
    .notice.show { display: block; }
    .empty { padding: 22px 0; color: var(--muted); text-align: center; }
    .agent-empty { grid-column: 1 / -1; padding: 34px 20px; }
    @media (max-width: 900px) { header { align-items: flex-start; flex-direction: column; } .cards, .agent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .two-columns { grid-template-columns: 1fr; } }
    @media (max-width: 580px) { .cards, .agent-grid, .kv { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 data-i18n="pageHeading">LoongSuite Pilot Dashboard</h1>
      </div>
      <div class="toolbar">
        <span id="status-dot" class="dot" aria-hidden="true"></span>
        <span id="status-text" data-i18n="statusConnecting">连接中...</span>
        <label class="status"><span data-i18n="refreshLabel">刷新</span>
          <select id="refresh-select" data-i18n-aria-label="refreshAriaLabel" aria-label="刷新间隔">
            <option value="5000" data-i18n="refresh5Seconds">5 秒</option>
            <option value="10000" data-i18n="refresh10Seconds" selected>10 秒</option>
            <option value="30000" data-i18n="refresh30Seconds">30 秒</option>
          </select>
        </label>
        <label class="status"><span data-i18n="languageLabel">语言</span>
          <svg class="language-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18M12 3c2.4 2.5 3.7 5.5 3.7 9s-1.3 6.5-3.7 9M12 3C9.6 5.5 8.3 8.5 8.3 12s1.3 6.5 3.7 9"></path>
          </svg>
          <select id="language-select" data-i18n-aria-label="languageAriaLabel" aria-label="界面语言">
            <option value="zh-CN" data-i18n="languageChinese">中文</option>
            <option value="en" data-i18n="languageEnglish">English</option>
          </select>
        </label>
      </div>
    </header>

    <div id="notice" class="notice"></div>

    <section class="section cards">
      <div class="card"><div class="label" data-i18n="todayTokens">今日 Token</div><div id="tokens" class="value">--</div><div id="token-detail" class="subvalue">--</div></div>
      <div class="card"><div class="label" data-i18n="todaySessions">今日 Session</div><div id="sessions" class="value">--</div><div class="subvalue" data-i18n="uniqueSessions">去重会话数</div></div>
      <div class="card"><div class="label" data-i18n="todayRequests">今日 Request</div><div id="requests" class="value">--</div><div class="subvalue" data-i18n="llmRequests">LLM 请求数</div></div>
      <div class="card"><div class="label" data-i18n="todayToolCalls">今日 Tool Call</div><div id="tools" class="value">--</div><div class="subvalue" data-i18n="toolCalls">工具调用数</div></div>
    </section>

    <section class="section panel">
      <div class="code-heading">
        <h2 data-i18n="codeChangesHeading">AI 文件增删行 · 按 Agent</h2>
        <div class="code-dates">
          <label><span data-i18n="codeStartDate">开始日期</span><input id="code-start" type="date" required></label>
          <label><span data-i18n="codeEndDate">结束日期</span><input id="code-end" type="date" required></label>
        </div>
      </div>
      <p id="code-date-range" class="code-note" aria-live="polite"></p>
      <div id="code-changes" class="code-table-wrap" aria-live="polite"></div>
      <p class="code-note" data-i18n="codeChangesNote">统计有成功编辑证据的文本文件物理行，含空行、注释及配置/文档；重复修改累计计数。未测量表示缺少差异证据，不等于没有产出。文件数为修改次数。</p>
    </section>

    <section class="section">
      <h2 data-i18n="agentDistribution">Agent 分布</h2>
      <div id="agent-grid" class="agent-grid"></div>
    </section>

    <section class="section two-columns">
      <div class="panel"><h2 data-i18n="tokenTrendHeading">最近 30 天 Token</h2><div id="token-trend"></div></div>
      <div class="panel"><h2 data-i18n="sessionTrendHeading">最近 30 天 Session</h2><div id="session-trend"></div></div>
    </section>

    <section class="section two-columns">
      <div class="panel"><h2 data-i18n="modelDistribution">模型分布</h2><div id="models" class="list"></div></div>
      <div class="panel"><h2 data-i18n="providerDistribution">服务商分布</h2><div id="providers" class="list"></div></div>
    </section>

    <section class="section panel"><h2 data-i18n="repositoryActivity">仓库活动</h2><div id="repos" class="list"></div></section>
  </main>

  <script>
    const DEFAULT_REFRESH_MS = 10000;
    const LANGUAGE_STORAGE_KEY = 'loongsuite-pilot.dashboard.language';
    const messages = {

        todayToolCalls: '今日 Tool Call',

        llmRequests: 'LLM 请求数',
        toolCalls: '工具调用数',
        agentDistribution: 'Agent 分布',
        codeChangesHeading: 'AI 文件增删行 · 按 Agent',
        codeStartDate: '开始日期',
        codeEndDate: '结束日期',
        codeDateRange: '{start} 至 {end}（包含首尾两天）· 可查询：{min} 至 {max}',
        codeInvalidDate: '请选择有效的开始日期和结束日期。',
        codeReversedDates: '开始日期不能晚于结束日期。',
        codeOutsideHistory: '所选日期超出当前历史保留范围，请重新选择。',
        codeHistoryUnavailable: '当前摘要不支持自选日期或历史统计暂不可用，请确认采集器已更新并等待下一次统计。',
        codeAdded: '新增行',
        codeDeleted: '删除行',

        codeFiles: '文件修改次数',

        codeUnmeasured: '未测量操作',
        codeFailed: '失败 / 取消',
        noCodeData: '尚无代码编辑统计；旧采集器或缺少编辑证据的记录无法确认代码量。',
        codeChangesNote: '统计有成功编辑证据的文本文件物理行，含空行、注释及配置/文档；重复修改累计计数。未测量表示缺少差异证据，不等于没有产出。文件数为修改次数。',
        tokenTrendHeading: '最近 30 天 Token',
        sessionTrendHeading: '最近 30 天 Session',
        modelDistribution: '模型分布',

        trendPointDescription: '{day}，{label} {value}',
        repositorySessions: '{value} 个 Session',

        statusConnecting: '连接中...',
        statusReady: '数据生成于 {time} · 每 {seconds} 秒读取',

        statusReadFailed: '读取失败',

        summaryReadError: '读取 metrics-summary.json 失败：{message}',
      },
      en: {
        pageTitle: 'LoongSuite Pilot Dashboard',
        pageHeading: 'LoongSuite Pilot Dashboard',
        refreshLabel: 'Refresh',
        refreshAriaLabel: 'Refresh interval',
        refresh5Seconds: '5 seconds',
        refresh10Seconds: '10 seconds',
        refresh30Seconds: '30 seconds',
        languageLabel: 'Language',
        languageAriaLabel: 'Interface language',
        languageChinese: '中文',
        languageEnglish: 'English',
        todayTokens: "Today's Tokens",
        todaySessions: "Today's Sessions",
        todayRequests: "Today's Requests",
        todayToolCalls: "Today's Tool Calls",
        uniqueSessions: 'Unique sessions',
        llmRequests: 'LLM requests',
        toolCalls: 'Tool calls',
        agentDistribution: 'Agent Distribution',
        codeChangesHeading: 'AI File Line Changes · By Agent',
        codeStartDate: 'Start date',
        codeEndDate: 'End date',
        codeDateRange: '{start} to {end} (both dates included) · Available: {min} to {max}',
        codeInvalidDate: 'Choose valid start and end dates.',
        codeReversedDates: 'The start date cannot be after the end date.',
        codeOutsideHistory: 'The selected dates are outside the retained history range.',
        codeHistoryUnavailable: 'Custom dates are unsupported by this summary or history is temporarily unavailable. Update the collector and wait for its next summary.',
        codeAdded: 'Added lines',
        codeDeleted: 'Deleted lines',
        codeNet: 'Net lines',
        codeFiles: 'File edits',
        codeMeasured: 'Measured operations',
        codeUnmeasured: 'Unmeasured operations',
        codeFailed: 'Failed / cancelled',
        noCodeData: 'No code edit metrics yet. Older collectors or records without edit evidence cannot establish code volume.',
        codeChangesNote: 'Physical text lines from confirmed edits, including blank lines, comments, configuration and documentation. Repeated edits accumulate. Unmeasured means missing diff evidence, not zero output. File edits count repeated changes.',
        tokenTrendHeading: 'Tokens · Last 30 Days',
        sessionTrendHeading: 'Sessions · Last 30 Days',
        modelDistribution: 'Model Distribution',
        providerDistribution: 'Provider Distribution',
        repositoryActivity: 'Repository Activity',
        tokenLabel: 'Token',
        sessionLabel: 'Session',
        eventLabel: 'Event',
        inputLabel: 'Input',
        outputLabel: 'Output',
        cacheReadLabel: 'Cache read',
        agentEventShare: '{percentage}% of all Agent events today',
        noAgentData: 'No Agent token data detected yet',
        noData: 'No data yet',
        noRepositoryData: 'No repository activity yet',
        trendDescription: '30-day {label} trend',
        trendPointDescription: '{day}, {label} {value}',
        repositorySessions: '{value} sessions',
        repositoryEvents: '{value} events',
        statusConnecting: 'Connecting...',
        statusReady: 'Generated at {time} · reading every {seconds} seconds',
        statusWaiting: 'Waiting for metrics',
        summaryNotReady: 'metrics-summary.json is not ready yet. Pilot normally writes it within a few seconds of startup.',
        statusReadFailed: 'Read failed',
        summaryHttpError: 'Failed to read metrics-summary.json: HTTP {status}',
        summaryReadError: 'Failed to read metrics-summary.json: {message}',
      },
    };

    function normalizeLanguage(language) {
      return typeof language === 'string' && language.trim().toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
    }

    function detectBrowserLanguage(languages, language) {
      const preferredLanguage = Array.isArray(languages)
        ? languages.find(candidate => typeof candidate === 'string' && candidate.trim())
        : undefined;
      return normalizeLanguage(preferredLanguage ?? language);
    }

    function isSupportedLanguage(language) {
      return language === 'zh-CN' || language === 'en';
    }

    function getLocalStorage() {
      try {
        return window.localStorage;
      } catch {
        return null;
      }
    }

    function readStoredLanguage(storage) {
      try {
        const language = storage?.getItem(LANGUAGE_STORAGE_KEY);
        return isSupportedLanguage(language) ? language : null;
      } catch {
        return null;
      }
    }

    function writeStoredLanguage(storage, language) {
      try {
        storage?.setItem(LANGUAGE_STORAGE_KEY, language);
      } catch {
        // Storage can be unavailable in private or locked-down browser contexts.
      }
    }

    const storage = getLocalStorage();
    let currentLanguage = readStoredLanguage(storage)
      ?? detectBrowserLanguage(navigator.languages, navigator.language);
    let refreshMs = DEFAULT_REFRESH_MS;
    let refreshTimer;
    let currentSummary = null;
    let codeStartDate = null;
    let codeEndDate = null;
    let viewState = { kind: 'connecting' };
    const $ = (id) => document.getElementById(id);

    function translate(key, values = {}) {
      const template = messages[currentLanguage]?.[key] ?? messages.en[key] ?? key;
      return Object.entries(values).reduce(
        (text, [name, value]) => text.replaceAll(`{${name}}`, String(value)),
        template,
      );
    }

    const count = (value) => new Intl.NumberFormat(currentLanguage).format(Number(value) || 0);
    function tokenCount(value) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return count(0);
      const magnitude = Math.abs(numeric);
      if (magnitude < 1_000_000) return count(numeric);
      const useBillions = magnitude >= 1_000_000_000;
      const divisor = useBillions ? 1_000_000_000 : 1_000_000;
      const suffix = useBillions ? 'B' : 'M';
      const compact = new Intl.NumberFormat(currentLanguage, {
        maximumFractionDigits: 2,
        useGrouping: false,
      })
        .format(numeric / divisor);
      return `${compact}${suffix}`;
    }
    const percentage = (value) => new Intl.NumberFormat(currentLanguage, {
      minimumFractionDigits: 1,
      maximumFractionDigits: 1,
    }).format((Number(value) || 0) * 100);
    function formatTime(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value ?? '') : date.toLocaleTimeString(currentLanguage);
    }
    function formatDay(value) {
      const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(value ?? ''));
      if (!match) return String(value ?? '');
      const date = new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
      return new Intl.DateTimeFormat(currentLanguage, {
        year: 'numeric', month: 'short', day: 'numeric',
      }).format(date);
    }
    const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    function setStatus(ok, text) {
      $('status-dot').classList.toggle('ok', ok);
      $('status-text').textContent = text;
    }

    function setNotice(text) {
      $('notice').textContent = text || '';
      $('notice').classList.toggle('show', Boolean(text));
    }

    function renderViewState() {
      if (viewState.kind === 'ready' && currentSummary) {
        setStatus(true, translate('statusReady', {
          time: formatTime(currentSummary.generatedAt),
          seconds: count(refreshMs / 1000),
        }));
        setNotice('');
        return;
      }
      if (viewState.kind === 'waiting') {
        setStatus(false, translate('statusWaiting'));
        setNotice(translate('summaryNotReady'));
        return;
      }
      if (viewState.kind === 'http-error') {
        setStatus(false, translate('statusReadFailed'));
        setNotice(translate('summaryHttpError', { status: viewState.status }));
        return;
      }
      if (viewState.kind === 'read-error') {
        setStatus(false, translate('statusReadFailed'));
        setNotice(translate('summaryReadError', { message: viewState.message }));
        return;
      }
      setStatus(false, translate('statusConnecting'));
      setNotice('');
    }

    function renderAgents(agentShares) {
      if (!agentShares.length) {
        $('agent-grid').innerHTML = `<div class="panel empty agent-empty">${escapeHtml(translate('noAgentData'))}</div>`;
        return;
      }
      $('agent-grid').innerHTML = agentShares.map((agent) => `
        <article class="agent-card" data-agent-type="${escapeHtml(agent.agentType)}">
          <div class="agent-title">${escapeHtml(agent.agentType)}</div>
          <div class="kv">
            <div><div class="label">${escapeHtml(translate('tokenLabel'))}</div><div class="value">${tokenCount(agent.tokens)}</div></div>
            <div><div class="label">${escapeHtml(translate('sessionLabel'))}</div><div class="value">${count(agent.sessions)}</div></div>
            <div><div class="label">${escapeHtml(translate('eventLabel'))}</div><div class="value">${count(agent.events)}</div></div>
          </div>
          <div class="subvalue">${escapeHtml(translate('agentEventShare', { percentage: percentage(agent.share) }))}</div>
        </article>
      `).join('');
    }

    function showTrendTooltip(event) {
      const bar = event.currentTarget;
      const wrap = bar.closest('.trend-wrap');
      const tooltip = wrap?.querySelector('.trend-tooltip');
      if (!tooltip) return;
      tooltip.innerHTML = `<span>${escapeHtml(bar.dataset.displayDay)}</span><strong>${escapeHtml(bar.dataset.label)} ${escapeHtml(bar.dataset.formattedValue)}</strong>`;
      tooltip.setAttribute('aria-hidden', 'false');
      tooltip.classList.add('show');

      const fillRect = bar.querySelector('.trend-bar-fill').getBoundingClientRect();
      const wrapRect = wrap.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      const desiredViewportLeft = fillRect.left + fillRect.width / 2 - tooltipRect.width / 2;
      const minViewportLeft = Math.max(4, wrapRect.left + 4);
      const maxViewportLeft = Math.min(
        window.innerWidth - tooltipRect.width - 4,
        wrapRect.right - tooltipRect.width - 4,
      );
      const desiredTop = fillRect.top - wrapRect.top - tooltipRect.height - 8;
      const maxTop = wrapRect.height - tooltipRect.height - 4;
      tooltip.style.left = `${clamp(desiredViewportLeft, minViewportLeft, maxViewportLeft) - wrapRect.left}px`;
      tooltip.style.top = `${clamp(desiredTop, 4, maxTop)}px`;
    }

    function hideTrendTooltip(event) {
      const tooltip = event.currentTarget.closest('.trend-wrap')?.querySelector('.trend-tooltip');
      tooltip?.setAttribute('aria-hidden', 'true');
      tooltip?.classList.remove('show');
    }

    function renderTrend(target, points, valueLabel, valueFormatter) {
      const container = $(target);
      const activeElement = document.activeElement;
      const focusedDay = container.contains(activeElement) && activeElement.matches('.trend-bar')
        ? activeElement.dataset.day
        : null;
      if (!points.length) {
        container.innerHTML = `<div class="empty">${escapeHtml(translate('noData'))}</div>`;
        return;
      }
      const shown = points.slice(-30);
      const max = Math.max(1, ...shown.map((point) => Number(point.value) || 0));
      container.innerHTML = `
        <div class="trend-wrap">
          <div class="trend" role="group" aria-label="${escapeHtml(translate('trendDescription', { label: valueLabel }))}">${shown.map((point) => {
          const height = Math.max(2, Math.round(((Number(point.value) || 0) / max) * 150));
          const formattedValue = valueFormatter(point.value);
          const displayDay = formatDay(point.day);
          const ariaLabel = translate('trendPointDescription', {
            day: displayDay, label: valueLabel, value: formattedValue,
          });
          return `<button type="button" class="trend-bar" tabindex="0" aria-label="${escapeHtml(ariaLabel)}" aria-describedby="${escapeHtml(target)}-tooltip" data-day="${escapeHtml(point.day)}" data-display-day="${escapeHtml(displayDay)}" data-label="${escapeHtml(valueLabel)}" data-formatted-value="${escapeHtml(formattedValue)}"><span class="trend-bar-fill" style="height:${height}px"></span></button>`;
        }).join('')}</div>
          <div id="${escapeHtml(target)}-tooltip" class="trend-tooltip" role="tooltip" aria-hidden="true"></div>
        </div>
        <div class="trend-labels"><span>${escapeHtml(formatDay(shown[0]?.day))}</span><span>${escapeHtml(formatDay(shown[shown.length - 1]?.day))}</span></div>`;
      const bars = [...container.querySelectorAll('.trend-bar')];
      bars.forEach((bar) => {
        bar.addEventListener('mouseenter', showTrendTooltip);
        bar.addEventListener('mouseleave', hideTrendTooltip);
        bar.addEventListener('focus', showTrendTooltip);
        bar.addEventListener('blur', hideTrendTooltip);
      });
      if (focusedDay) {
        bars.find((bar) => bar.dataset.day === focusedDay)?.focus({ preventScroll: true });
      }
    }

    function renderShares(target, shares, nameKey, valueKey, valueFormatter) {
      if (!shares.length) {
        $(target).innerHTML = `<div class="empty">${escapeHtml(translate('noData'))}</div>`;
        return;
      }
      $(target).innerHTML = shares.map((entry) => `
        <div class="list-row">
          <div class="list-name" title="${escapeHtml(entry[nameKey])}">${escapeHtml(entry[nameKey])}<div class="bar"><span style="width:${Math.max(1, Math.min(100, Number(entry.share) * 100))}%"></span></div></div>
          <span>${valueFormatter(entry[valueKey])}</span><span>${percentage(entry.share)}%</span>
        </div>`).join('');
    }

    function renderRepos(repos) {
      $('repos').innerHTML = repos.length ? repos.map((repo) => `
        <div class="list-row"><div class="list-name" title="${escapeHtml(repo.repo)}">${escapeHtml(repo.repo)}</div><span>${escapeHtml(translate('repositorySessions', { value: count(repo.sessions) }))}</span><span>${escapeHtml(translate('repositoryEvents', { value: count(repo.events) }))}</span></div>
      `).join('') : `<div class="empty">${escapeHtml(translate('noRepositoryData'))}</div>`;
    }

    function renderCodeChanges(summary) {
      const history = summary.codeChangeHistory;
      const validDate = value => typeof value === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(value)
        && Number.isFinite(Date.parse(value + 'T00:00:00Z'))
        && new Date(value + 'T00:00:00Z').toISOString().slice(0, 10) === value;
      const showError = key => { $('code-changes').innerHTML = `<div class="empty">${escapeHtml(translate(key))}</div>`; };
      const available = history && validDate(history.startDate) && validDate(history.endDate)
        && history.startDate <= history.endDate && Array.isArray(history.days);
      $('code-start').disabled = $('code-end').disabled = !available;
      $('code-date-range').textContent = '';
      if (!available) { showError('codeHistoryUnavailable'); return; }
      // 默认使用采集器日期，避免浏览器时区不同导致跨日；用户选择在刷新时保留。
      codeStartDate ??= history.endDate;
      codeEndDate ??= history.endDate;
      for (const id of ['code-start', 'code-end']) {
        $(id).min = history.startDate;
        $(id).max = history.endDate;
      }
      $('code-start').value = codeStartDate;
      $('code-end').value = codeEndDate;
      if (!validDate(codeStartDate) || !validDate(codeEndDate)) { showError('codeInvalidDate'); return; }
      if (codeStartDate > codeEndDate) { showError('codeReversedDates'); return; }
      if (codeStartDate < history.startDate || codeEndDate > history.endDate) { showError('codeOutsideHistory'); return; }
      $('code-date-range').textContent = translate('codeDateRange', {
        start: codeStartDate, end: codeEndDate, min: history.startDate, max: history.endDate,
      });
      const agents = new Map();
      const metrics = ['addedLines', 'deletedLines', 'filesChanged', 'measuredOperations', 'unmeasuredOperations', 'failedOperations'];
      for (const day of history.days) {
        if (day.day < codeStartDate || day.day > codeEndDate) continue;
        for (const entry of day.codeChanges) {
          const total = agents.get(entry.agentType) ?? { agentType: entry.agentType };
          for (const key of metrics) total[key] = (total[key] ?? 0) + (Number(entry[key]) || 0);
          agents.set(entry.agentType, total);
        }
      }
      const changes = [...agents.values()].sort((a, b) => a.agentType.localeCompare(b.agentType));
      if (!Array.isArray(changes) || !changes.length) {
        $('code-changes').innerHTML = `<div class="empty">${escapeHtml(translate('noCodeData'))}</div>`;
        return;
      }
      const headers = ['codeAdded', 'codeDeleted', 'codeNet', 'codeFiles', 'codeMeasured', 'codeUnmeasured', 'codeFailed'];
      const signed = value => value > 0 ? `+${count(value)}` : value < 0 ? `−${count(-value)}` : count(0);
      $('code-changes').innerHTML = `<table class="code-table"><thead><tr><th scope="col">Agent</th>${headers.map(key => `<th scope="col">${escapeHtml(translate(key))}</th>`).join('')}</tr></thead><tbody>${changes.map(entry => {
        const measured = Number(entry.measuredOperations) > 0;
        return `<tr><th scope="row">${escapeHtml(entry.agentType)}</th>
          <td class="code-added">${measured ? signed(entry.addedLines) : '—'}</td>
          <td class="code-deleted">${measured ? signed(-entry.deletedLines) : '—'}</td>
          <td>${measured ? signed(entry.addedLines - entry.deletedLines) : '—'}</td>
          <td>${measured ? count(entry.filesChanged) : '—'}</td>
          <td>${count(entry.measuredOperations)}</td>
          <td class="${Number(entry.unmeasuredOperations) > 0 ? 'code-unknown' : ''}">${count(entry.unmeasuredOperations)}</td>
          <td>${count(entry.failedOperations)}</td></tr>`;
      }).join('')}</tbody></table>`;
    }

    function renderSummary(summary) {
      const today = summary.ranges.today;
      $('tokens').textContent = tokenCount(today.totalTokens);
      $('token-detail').textContent = `${translate('inputLabel')} ${tokenCount(today.inputTokens)} · ${translate('outputLabel')} ${tokenCount(today.outputTokens)} · ${translate('cacheReadLabel')} ${tokenCount(today.cacheReadTokens)}`;
      $('sessions').textContent = count(today.totalSessions);
      $('requests').textContent = count(today.totalRequests);
      $('tools').textContent = count(today.totalToolCalls);
      renderCodeChanges(summary);
      // Agent cards are intentionally derived only from agentShares. New agent
      // types therefore appear without a dashboard code change.
      renderAgents(Array.isArray(today.agentShares) ? today.agentShares : []);
      renderTrend('token-trend', Array.isArray(summary.dailyTokens) ? summary.dailyTokens : [], translate('tokenLabel'), tokenCount);
      renderTrend('session-trend', Array.isArray(summary.dailySessions) ? summary.dailySessions : [], translate('sessionLabel'), count);
      renderShares('models', Array.isArray(today.modelShares) ? today.modelShares : [], 'model', 'totalTokens', tokenCount);
      renderShares('providers', Array.isArray(today.providerShares) ? today.providerShares : [], 'provider', 'totalTokens', tokenCount);
      renderRepos(Array.isArray(today.repoShares) ? today.repoShares : []);
    }

    function applyLanguage(language, persist = false) {
      currentLanguage = isSupportedLanguage(language) ? language : normalizeLanguage(language);
      if (persist) writeStoredLanguage(storage, currentLanguage);
      document.documentElement.lang = currentLanguage;
      document.title = translate('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach((element) => {
        element.textContent = translate(element.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
        element.setAttribute('aria-label', translate(element.dataset.i18nAriaLabel));
      });
      $('language-select').value = currentLanguage;
      if (currentSummary) renderSummary(currentSummary);
      renderViewState();
    }

    async function refresh() {
      try {
        const response = await fetch('/metrics-summary.json', { cache: 'no-store' });
        if (response.status === 503) {
          viewState = { kind: 'waiting' };
          renderViewState();
          return;
        }
        if (!response.ok) {
          viewState = { kind: 'http-error', status: response.status };
          renderViewState();
          return;
        }
        const summary = await response.json();
        renderSummary(summary);
        currentSummary = summary;
        viewState = { kind: 'ready' };
        renderViewState();
      } catch (error) {
        viewState = {
          kind: 'read-error',
          message: error instanceof Error ? error.message : String(error),
        };
        renderViewState();
      }
    }

    function restartTimer() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(refresh, refreshMs);
    }

    $('refresh-select').addEventListener('change', (event) => {
      const value = Number(event.target.value);
      if (!Number.isFinite(value) || value <= 0) return;
      refreshMs = value;
      restartTimer();
      renderViewState();
      void refresh();
    });

    $('language-select').addEventListener('change', (event) => {
      applyLanguage(event.target.value, true);
    });

    $('code-start').addEventListener('change', event => {
      codeStartDate = event.target.value;
      if (currentSummary) renderCodeChanges(currentSummary);
    });
    $('code-end').addEventListener('change', event => {
      codeEndDate = event.target.value;
      if (currentSummary) renderCodeChanges(currentSummary);
    });

    applyLanguage(currentLanguage);
    void refresh();
    restartTimer();
  </script>
</body>
</html>
